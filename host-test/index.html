<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>course-kit test host</title>
    <style>
      :root { color-scheme: dark; --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #6366f1; }
      * { box-sizing: border-box; }
      body { margin: 0; display: grid; grid-template-columns: 340px 1fr; height: 100vh; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, sans-serif; }
      aside { padding: 16px; overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
      h1 { margin: 0 0 4px; font-size: 15px; }
      p.muted, .muted { color: var(--muted); }
      fieldset { margin: 12px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
      legend { padding: 0 4px; color: var(--muted); }
      label { display: block; margin: 4px 0; }
      input, select, button { max-width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
      button { cursor: pointer; }
      pre { margin: 4px 0 0; max-height: 220px; overflow: auto; padding: 6px; background: var(--bg); border-radius: 4px; font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
      main { position: relative; min-width: 0; }
      iframe { width: 100%; height: 100%; border: 0; background: #060a13; }
    </style>
  </head>
  <body>
    <aside>
      <h1>course-kit test host</h1>
      <p class="muted">A tiny host to try a course in an iframe on another origin. Run the course on its own port (<code>npm run dev</code>) and load it here.</p>
      <fieldset>
        <legend>Course</legend>
        <label>URL <input id="url" size="28" value="http://localhost:5173/" /></label>
        <button id="load">Load</button>
        <span id="status" class="muted"></span>
      </fieldset>
      <fieldset>
        <legend>Commands to the course</legend>
        <label>Language <select id="locale"></select></label>
        <label>Code language <select id="code"><option>ruby</option><option>typescript</option></select></label>
        <label>Open unit <select id="unit"></select></label>
        <label><input id="visible" type="checkbox" checked /> visible</label>
        <label><input id="reduced" type="checkbox" /> ask for reduced motion (applies on next load)</label>
        <button id="merge">Simulate sign-in (merge progress)</button>
        <button id="reset">Forget the host's progress</button>
      </fieldset>
      <fieldset>
        <legend>Progress kept by the host</legend>
        <pre id="progress"></pre>
      </fieldset>
      <fieldset>
        <legend>Messages from the course</legend>
        <pre id="log"></pre>
      </fieldset>
    </aside>
    <main><div id="frame" style="height: 100%"></div></main>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
