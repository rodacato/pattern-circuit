name: CI

# main is verified in deploy.yml before publishing; here, every pull request.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The runtime Dojo runs Ruby on: the code the player sees is executed with it.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.1'
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage
        run: npm run coverage
      - name: Build
        run: npm run build
