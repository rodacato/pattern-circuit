name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main ya se verifica en deploy.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests con cobertura
        run: npm run coverage
      - name: Build
        run: npm run build
